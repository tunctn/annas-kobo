[package]
name = "annas-kobo"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Tunç Türkmen"]
description = "Search Anna's Archive and LibGen from a Kobo, download, kepubify, into the library"
repository = "https://github.com/tunctn/annas-kobo"

[dependencies]
form_urlencoded = "1.2.2"
html-escape = "0.2.15"
kepub-rs = "0.1.1"
log = "0.4.34"
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode-perl", "unicode-case", "perf"] }
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tiny_http = "0.12"
ureq = { version = "3", default-features = false, features = ["rustls", "gzip", "cookies", "json"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
